spring:
  application:
    name: ${APPLICATION_NAME:ntn-cmp-mailtrace-api}
  cloud:
    refresh:
      extra-refreshable:
        - javax.sql.DataSource
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        fail-fast: false
        retry:
          initial-interval: 10000
          max-interval: 30000
          multiplier: 1.5
          max-attempts: 0
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        file-extension: ${NACOS_FILE_EXTENSION:yaml}
        group: ${NACOS_GROUP:bcs}
        namespace: ${NACOS_NAMESPACE:ntn}
        refresh-enabled: ${NACOS_REFRESH_ENABLED:true}
        retry:
          max-attempts: 0
        cache-time: 60
