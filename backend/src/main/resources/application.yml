# 本文件作为本地兜底和开发参考；启用 Nacos 时以 ntn-cmp-mailtrace-api.yaml 为准。
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}

spring:
  application:
    # 需要和 Nacos Data ID 前缀一致。
    name: ${APPLICATION_NAME:ntn-cmp-mailtrace-api}
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    # 本地兜底数据库。
    url: ${MAILTRACE_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/mailtrace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MAILTRACE_DATASOURCE_USERNAME:root}
    password: ${MAILTRACE_DATASOURCE_PASSWORD:root123}
    driver-class-name: ${MAILTRACE_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
  flyway:
    enabled: ${MAILTRACE_FLYWAY_ENABLED:true}
    locations: ${MAILTRACE_FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${MAILTRACE_FLYWAY_BASELINE_ON_MIGRATE:true}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ntn.fziot.mailtrace: INFO

mailtrace:
  security:
    permit-all: false
    jwt:
      secret: ${MAILTRACE_JWT_SECRET:mailtrace-local-dev-secret-change-before-production}
      expires-in-seconds: ${MAILTRACE_JWT_EXPIRES_IN_SECONDS:7200}
  mail:
    fetch-fixed-delay-ms: ${MAILTRACE_MAIL_FETCH_FIXED_DELAY_MS:60000}
    retry-fixed-delay-ms: ${MAILTRACE_MAIL_RETRY_FIXED_DELAY_MS:300000}
  sla:
    check-fixed-delay-ms: ${MAILTRACE_SLA_CHECK_FIXED_DELAY_MS:60000}
  holiday:
    national-api-url-template: ${MAILTRACE_HOLIDAY_NATIONAL_API_URL_TEMPLATE:https://api.jiejiariapi.com/v1/holidays/{year}}
    national-api-timeout-ms: ${MAILTRACE_HOLIDAY_NATIONAL_API_TIMEOUT_MS:5000}
  storage:
    # 文件存储类型：oss 或 minio。
    enabled: ${MAILTRACE_STORAGE_ENABLED:true}
    type: ${MAILTRACE_STORAGE_TYPE:oss}
    minio:
      # 仅 type=minio 时生效。
      endpoint: ${MAILTRACE_MINIO_ENDPOINT:http://127.0.0.1:9000}
      public-endpoint: ${MAILTRACE_MINIO_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
      region: ${MAILTRACE_MINIO_REGION:us-east-1}
      access-key: ${MAILTRACE_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MAILTRACE_MINIO_SECRET_KEY:minioadmin123}
      bucket: ${MAILTRACE_MINIO_BUCKET:mailtrace-attachments}

aliyun:
  oss:
    # 仅 type=oss 时生效。
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:smarty-cmp-test}
    # OSS 对象目录前缀。
    dir: ${ALIYUN_OSS_DIR:ets-dev}
