server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: mailtrace-backend
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mailtrace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ntn.fziot.mailtrace: INFO

mailtrace:
  security:
    permit-all: false
    jwt:
      secret: mailtrace-local-dev-secret-change-before-production
      expires-in-seconds: 7200
  mail:
    fetch-fixed-delay-ms: 60000
  storage:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin123
    bucket: mailtrace-attachments
