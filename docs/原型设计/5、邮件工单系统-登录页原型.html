<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮件工单系统 - 登录页原型</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #0f6bff;
            --primary-dark: #0756df;
            --primary-soft: #eaf3ff;
            --text-main: #0f172a;
            --text-sub: #4b587c;
            --text-muted: #8a96b5;
            --border: #dce4f2;
            --bg: #f6faff;
            --danger: #dc2626;
            --success: #0f9f6e;
        }

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            width: 100%;
            min-height: 100vh;
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            overflow: hidden;
            background:
                radial-gradient(circle at 16% 20%, rgba(15, 107, 255, 0.14), transparent 30%),
                radial-gradient(circle at 78% 24%, rgba(82, 142, 255, 0.10), transparent 26%),
                linear-gradient(135deg, #f8fbff 0%, #eef6ff 52%, #f8fbff 100%);
        }

        button,
        input {
            font: inherit;
        }

        .prototype-shell {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        .prototype-stage {
            position: relative;
            width: 100%;
            min-width: 1180px;
            min-height: 100vh;
        }

        .prototype-artboard {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 16% 20%, rgba(15, 107, 255, 0.14), transparent 30%),
                radial-gradient(circle at 78% 24%, rgba(82, 142, 255, 0.10), transparent 26%),
                linear-gradient(135deg, #f8fbff 0%, #eef6ff 52%, #f8fbff 100%);
        }

        .version-badge {
            position: absolute;
            top: 0;
            left: 24px;
            z-index: 20;
            height: 50px;
            min-width: 196px;
            padding: 0 32px;
            border: 0;
            border-radius: 0 0 10px 10px;
            color: #fff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0;
            background: linear-gradient(135deg, #0f6bff 0%, #075be8 100%);
            box-shadow: 0 14px 30px rgba(15, 107, 255, 0.24);
        }

        .page {
            width: 100%;
            height: 100vh;
            min-height: 760px;
            margin: 0 auto;
            padding: clamp(64px, 7vh, 90px) clamp(48px, 5.8vw, 120px) clamp(38px, 4vh, 52px);
            display: grid;
            grid-template-columns: minmax(620px, 1fr) 540px;
            gap: clamp(56px, 5vw, 96px);
            align-items: start;
        }

        .intro {
            width: min(680px, 100%);
            justify-self: center;
            padding-top: 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 54px;
        }

        .brand-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: linear-gradient(135deg, #0f6bff 0%, #075be8 100%);
            box-shadow: 0 16px 34px rgba(15, 107, 255, 0.24);
            font-size: 24px;
        }

        .brand-title {
            margin: 0 0 4px;
            font-size: 28px;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: 0;
        }

        .brand-subtitle {
            margin: 0;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 600;
        }

        .hero-copy h1 {
            margin: 0;
            font-size: 40px;
            line-height: 1.28;
            font-weight: 800;
            letter-spacing: 0;
        }

        .hero-copy strong {
            color: var(--primary);
        }

        .hero-copy p {
            width: min(540px, 100%);
            margin: 22px 0 46px;
            color: var(--text-sub);
            font-size: 17px;
            line-height: 1.85;
            font-weight: 600;
        }

        .workflow {
            position: relative;
            width: 620px;
            max-width: 100%;
            height: 410px;
        }

        .workflow::before,
        .workflow::after {
            content: "";
            position: absolute;
            inset: 36px 44px 42px 44px;
            border: 2px dashed rgba(15, 107, 255, 0.14);
            border-radius: 24px;
        }

        .workflow::after {
            inset: 158px 20px 58px 18px;
            border-radius: 20px;
        }

        .feature {
            position: absolute;
            z-index: 2;
            min-width: 184px;
            min-height: 72px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 13px;
            border: 1px solid rgba(231, 238, 249, 0.86);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.90);
            box-shadow: 0 18px 42px rgba(64, 94, 138, 0.12);
        }

        .feature:nth-child(1) {
            top: 0;
            left: 0;
        }

        .feature:nth-child(2) {
            top: 0;
            right: 0;
        }

        .feature:nth-child(3) {
            left: 0;
            bottom: 34px;
        }

        .feature:nth-child(4) {
            right: 58px;
            bottom: 2px;
        }

        .feature-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            color: var(--primary);
            background: var(--primary-soft);
            font-size: 18px;
        }

        .feature-title {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 800;
        }

        .feature-text {
            display: block;
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .screen-preview {
            position: absolute;
            left: 108px;
            top: 92px;
            z-index: 1;
            width: 410px;
            height: 274px;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.90);
            border: 1px solid rgba(218, 229, 244, 0.72);
            box-shadow: 0 30px 58px rgba(39, 76, 130, 0.16);
        }

        .screen-bar {
            height: 34px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 12px;
            background: rgba(248, 251, 255, 0.96);
            border-bottom: 1px solid rgba(226, 234, 248, 0.82);
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 999px;
        }

        .screen-body {
            display: grid;
            grid-template-columns: 45px 1fr;
            height: calc(100% - 34px);
        }

        .mini-sidebar {
            padding: 10px 0;
            background: linear-gradient(180deg, #155fc8 0%, #2453a4 100%);
            color: rgba(255, 255, 255, 0.72);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-size: 10px;
        }

        .mini-content {
            padding: 16px 18px;
            background: rgba(249, 252, 255, 0.96);
        }

        .mini-search {
            height: 14px;
            width: 196px;
            margin-bottom: 14px;
            border-radius: 999px;
            background: #eef4fb;
        }

        .mini-row {
            height: 44px;
            margin-bottom: 10px;
            border-radius: 7px;
            background: #fff;
            border: 1px solid rgba(231, 238, 249, 0.84);
            display: grid;
            grid-template-columns: 16px 1fr 54px;
            gap: 10px;
            align-items: center;
            padding: 0 13px;
        }

        .mini-avatar {
            width: 16px;
            height: 16px;
            border-radius: 999px;
            background: #e8f1ff;
        }

        .mini-line,
        .mini-line-short {
            height: 8px;
            border-radius: 999px;
            background: #e8eef7;
        }

        .mini-line-short {
            width: 46px;
        }

        .shield {
            position: absolute;
            right: 24px;
            bottom: 70px;
            z-index: 3;
            width: 78px;
            height: 78px;
            border-radius: 22px 22px 30px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 36px;
            background: linear-gradient(145deg, #5aa2ff 0%, #0f6bff 100%);
            box-shadow: 0 22px 36px rgba(15, 107, 255, 0.24);
            clip-path: polygon(50% 0%, 95% 18%, 88% 78%, 50% 100%, 12% 78%, 5% 18%);
        }

        .floating-icon {
            position: absolute;
            z-index: 1;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(15, 107, 255, 0.52);
            background: rgba(235, 244, 255, 0.74);
        }

        .floating-icon.mail-left {
            left: 7px;
            top: 207px;
        }

        .floating-icon.mail-center {
            left: 274px;
            top: 46px;
        }

        .floating-icon.chart-right {
            right: 2px;
            top: 222px;
        }

        .login-panel {
            height: calc(100vh - clamp(112px, 11vh, 142px));
            min-height: 700px;
            max-height: 860px;
            border: 1px solid rgba(215, 225, 240, 0.92);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 30px 58px rgba(33, 65, 112, 0.14);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: clamp(78px, 9vh, 108px) 48px 42px;
        }

        .form-box {
            width: 444px;
            max-width: 100%;
        }

        .form-header {
            margin-bottom: clamp(54px, 6vh, 72px);
            text-align: center;
        }

        .form-header h2 {
            margin: 0 0 16px;
            font-size: 36px;
            line-height: 1.25;
            font-weight: 800;
            letter-spacing: 0;
        }

        .form-header p {
            margin: 0;
            color: var(--text-sub);
            font-size: 16px;
            font-weight: 600;
        }

        .alert {
            display: none;
            min-height: 42px;
            margin: -52px 0 20px;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.45;
        }

        .alert.show {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .alert.error {
            color: #991b1b;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .alert.success {
            color: #047857;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
        }

        .field {
            margin-bottom: 30px;
        }

        .field-label {
            display: block;
            margin-bottom: 14px;
            color: var(--text-main);
            font-size: 17px;
            line-height: 1;
            font-weight: 800;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            color: var(--text-muted);
            font-size: 20px;
            text-align: center;
            pointer-events: none;
        }

        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 8px;
            color: var(--text-muted);
            background: transparent;
            cursor: pointer;
            transition: color 0.18s ease, background 0.18s ease;
        }

        .password-toggle:hover,
        .password-toggle:focus-visible {
            color: var(--primary);
            background: var(--primary-soft);
            outline: none;
        }

        .text-input {
            width: 100%;
            height: 60px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 0 58px;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.94);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .text-input::placeholder {
            color: #98a3bd;
            font-weight: 600;
        }

        .text-input:hover {
            border-color: #b9c8de;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(15, 107, 255, 0.10);
            background: #fff;
        }

        .text-input.invalid {
            border-color: #fca5a5;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.08);
        }

        .field-error {
            display: none;
            margin: 9px 0 0 4px;
            color: var(--danger);
            font-size: 13px;
            font-weight: 600;
        }

        .field-error.show {
            display: block;
        }

        .form-row {
            margin: 6px 0 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #334155;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .remember input {
            position: absolute;
            opacity: 0;
        }

        .checkbox-visual {
            width: 22px;
            height: 22px;
            border: 1.5px solid #b6c2d6;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: #fff;
            transition: all 0.18s ease;
            font-size: 13px;
        }

        .remember input:checked + .checkbox-visual {
            border-color: var(--primary);
            background: var(--primary);
            box-shadow: 0 8px 18px rgba(15, 107, 255, 0.24);
        }

        .remember input:focus-visible + .checkbox-visual {
            outline: 3px solid rgba(15, 107, 255, 0.16);
        }

        .link-button {
            border: 0;
            padding: 4px 0;
            color: var(--primary);
            background: transparent;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .link-button:hover,
        .link-button:focus-visible {
            color: var(--primary-dark);
            text-decoration: underline;
            outline: none;
        }

        .login-button {
            width: 100%;
            height: 58px;
            border: 0;
            border-radius: 6px;
            color: #fff;
            background: linear-gradient(135deg, #0f6bff 0%, #0560ef 100%);
            box-shadow: 0 16px 28px rgba(15, 107, 255, 0.22);
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 0;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 34px rgba(15, 107, 255, 0.28);
        }

        .login-button:focus-visible {
            outline: 4px solid rgba(15, 107, 255, 0.16);
        }

        .login-button:disabled {
            cursor: not-allowed;
            transform: none;
            opacity: 0.78;
            box-shadow: none;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            margin-right: 10px;
            border: 2px solid rgba(255, 255, 255, 0.48);
            border-top-color: #fff;
            border-radius: 999px;
            animation: spin 0.82s linear infinite;
            vertical-align: -3px;
        }

        .login-button.loading .spinner {
            display: inline-block;
        }

        .helper {
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.7;
            font-weight: 600;
            text-align: center;
        }

        .helper button {
            border: 0;
            padding: 0;
            color: var(--primary);
            background: transparent;
            font-weight: 800;
            cursor: pointer;
        }

        .footer {
            position: absolute;
            left: 63px;
            bottom: 76px;
            color: #7180a0;
            font-size: 15px;
            font-weight: 600;
        }

        .modal-mask {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(15, 23, 42, 0.28);
            backdrop-filter: blur(5px);
        }

        .modal-mask.show {
            display: flex;
        }

        .modal {
            width: 420px;
            max-width: 100%;
            padding: 28px;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 26px 70px rgba(15, 23, 42, 0.22);
        }

        .modal h3 {
            margin: 0 0 10px;
            font-size: 20px;
            font-weight: 800;
        }

        .modal p {
            margin: 0 0 22px;
            color: var(--text-sub);
            line-height: 1.7;
            font-size: 14px;
            font-weight: 600;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-button {
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 0 16px;
            color: #334155;
            background: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-button.primary {
            border-color: var(--primary);
            color: #fff;
            background: var(--primary);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 1100px) {
            .page {
                grid-template-columns: 1fr;
                gap: 36px;
                padding: 92px 28px 48px;
            }

            .login-panel {
                min-height: auto;
                padding: 64px 28px;
            }

            .form-header {
                margin-bottom: 56px;
            }

            .footer {
                position: static;
                width: min(540px, 100%);
                margin: 28px auto 0;
            }
        }

        @media (max-width: 640px) {
            .version-badge {
                left: 16px;
                min-width: 150px;
                height: 44px;
                padding: 0 20px;
                font-size: 18px;
            }

            .page {
                padding: 76px 18px 32px;
            }

            .brand {
                margin-bottom: 32px;
            }

            .brand-title {
                font-size: 22px;
            }

            .hero-copy h1 {
                font-size: 31px;
            }

            .hero-copy p {
                margin-bottom: 34px;
                font-size: 15px;
            }

            .workflow {
                height: auto;
                display: grid;
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .workflow::before,
            .workflow::after,
            .screen-preview,
            .shield,
            .floating-icon {
                display: none;
            }

            .feature {
                position: static;
                min-width: 0;
            }

            .login-panel {
                padding: 42px 18px;
            }

            .form-header {
                margin-bottom: 42px;
            }

            .form-header h2 {
                font-size: 30px;
            }

            .text-input {
                height: 56px;
                font-size: 16px;
            }

            .form-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 14px;
                margin-bottom: 34px;
            }
        }
    </style>
</head>
<body>
    <div class="prototype-shell">
        <div class="prototype-stage" id="prototypeStage">
            <div class="prototype-artboard">
                <button class="version-badge" type="button">V0.1 登录页</button>

                <main class="page">
        <section class="intro" aria-label="产品介绍">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true"><i class="fa-solid fa-envelope"></i></div>
                <div>
                    <h1 class="brand-title">邮件工单系统</h1>
                    <p class="brand-subtitle">企业级邮件工单管理平台</p>
                </div>
            </div>

            <div class="hero-copy">
                <h2>让邮件沟通<strong>更高效</strong></h2>
                <p>集中管理客户邮件，自动生成工单，智能分配处理，全流程跟踪，提升团队协作效率与客户满意度。</p>
            </div>

            <div class="workflow" aria-label="系统能力">
                <div class="feature">
                    <span class="feature-icon"><i class="fa-regular fa-envelope"></i></span>
                    <span>
                        <strong class="feature-title">自动收取邮件</strong>
                        <span class="feature-text">IMAP/POP3 实时同步</span>
                    </span>
                </div>
                <div class="feature">
                    <span class="feature-icon"><i class="fa-solid fa-headset"></i></span>
                    <span>
                        <strong class="feature-title">自动生成工单</strong>
                        <span class="feature-text">智能解析，快速建单</span>
                    </span>
                </div>
                <div class="feature">
                    <span class="feature-icon"><i class="fa-regular fa-user"></i></span>
                    <span>
                        <strong class="feature-title">分配处理人</strong>
                        <span class="feature-text">按规则自动分配</span>
                    </span>
                </div>
                <div class="feature">
                    <span class="feature-icon"><i class="fa-solid fa-chart-line"></i></span>
                    <span>
                        <strong class="feature-title">SLA 监控</strong>
                        <span class="feature-text">超时提醒，保障服务</span>
                    </span>
                </div>

                <div class="screen-preview" aria-hidden="true">
                    <div class="screen-bar">
                        <span class="dot" style="background:#f87171"></span>
                        <span class="dot" style="background:#fbbf24"></span>
                        <span class="dot" style="background:#34d399"></span>
                    </div>
                    <div class="screen-body">
                        <div class="mini-sidebar">
                            <i class="fa-solid fa-inbox"></i>
                            <i class="fa-regular fa-clock"></i>
                            <i class="fa-regular fa-comment-dots"></i>
                            <i class="fa-solid fa-chart-simple"></i>
                            <i class="fa-solid fa-gear"></i>
                        </div>
                        <div class="mini-content">
                            <div class="mini-search"></div>
                            <div class="mini-row">
                                <span class="mini-avatar"></span>
                                <span class="mini-line"></span>
                                <span class="mini-line-short"></span>
                            </div>
                            <div class="mini-row">
                                <span class="mini-avatar"></span>
                                <span class="mini-line"></span>
                                <span class="mini-line-short"></span>
                            </div>
                            <div class="mini-row">
                                <span class="mini-avatar"></span>
                                <span class="mini-line"></span>
                                <span class="mini-line-short"></span>
                            </div>
                            <div class="mini-row">
                                <span class="mini-avatar"></span>
                                <span class="mini-line"></span>
                                <span class="mini-line-short"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="floating-icon mail-left"><i class="fa-regular fa-envelope"></i></div>
                <div class="floating-icon mail-center"><i class="fa-regular fa-envelope"></i></div>
                <div class="floating-icon chart-right"><i class="fa-solid fa-chart-column"></i></div>
                <div class="shield"><i class="fa-solid fa-check"></i></div>
            </div>
        </section>

        <section class="login-panel" aria-label="登录表单">
            <form class="form-box" id="loginForm" novalidate>
                <div class="form-header">
                    <h2>欢迎登录</h2>
                    <p>请输入您的账号和密码登录系统</p>
                </div>

                <div class="alert error" id="formAlert" role="alert">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="formAlertText">请输入账号和密码。</span>
                </div>

                <div class="field">
                    <label class="field-label" for="account">账号</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-user input-icon" aria-hidden="true"></i>
                        <input class="text-input" id="account" name="account" type="text" autocomplete="username" placeholder="请输入账号 / 邮箱">
                    </div>
                    <p class="field-error" id="accountError">请输入账号或邮箱</p>
                </div>

                <div class="field">
                    <label class="field-label" for="password">密码</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon" aria-hidden="true"></i>
                        <input class="text-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
                        <button class="password-toggle" id="passwordToggle" type="button" aria-label="显示密码" title="显示/隐藏密码">
                            <i class="fa-regular fa-eye-slash"></i>
                        </button>
                    </div>
                    <p class="field-error" id="passwordError">请输入密码</p>
                </div>

                <div class="form-row">
                    <label class="remember">
                        <input id="remember" name="remember" type="checkbox" checked>
                        <span class="checkbox-visual"><i class="fa-solid fa-check"></i></span>
                        <span>记住我</span>
                    </label>
                    <button class="link-button" id="forgotButton" type="button">忘记密码?</button>
                </div>

                <button class="login-button" id="loginButton" type="submit">
                    <span class="spinner" aria-hidden="true"></span>
                    <span id="loginButtonText">登录</span>
                </button>

                <p class="helper">首次无账号？<button type="button" id="noAccountButton">请联系管理员创建账号</button></p>
            </form>
        </section>
                </main>

                <footer class="footer">© 2026 邮件工单系统. All rights reserved.</footer>
            </div>
        </div>
    </div>

    <div class="modal-mask" id="modalMask" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <h3 id="modalTitle">忘记密码</h3>
            <p id="modalText">请联系系统管理员重置密码。为保护邮箱与工单数据安全，第一版不开放自助找回入口。</p>
            <div class="modal-actions">
                <button class="modal-button" id="modalCancel" type="button">取消</button>
                <button class="modal-button primary" id="modalConfirm" type="button">我知道了</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const account = document.getElementById('account');
        const password = document.getElementById('password');
        const accountError = document.getElementById('accountError');
        const passwordError = document.getElementById('passwordError');
        const formAlert = document.getElementById('formAlert');
        const formAlertText = document.getElementById('formAlertText');
        const loginButton = document.getElementById('loginButton');
        const loginButtonText = document.getElementById('loginButtonText');
        const passwordToggle = document.getElementById('passwordToggle');
        const modalMask = document.getElementById('modalMask');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const forgotButton = document.getElementById('forgotButton');
        const noAccountButton = document.getElementById('noAccountButton');
        const modalCancel = document.getElementById('modalCancel');
        const modalConfirm = document.getElementById('modalConfirm');

        function setFieldError(input, errorNode, message) {
            input.classList.add('invalid');
            errorNode.textContent = message;
            errorNode.classList.add('show');
        }

        function clearFieldError(input, errorNode) {
            input.classList.remove('invalid');
            errorNode.classList.remove('show');
        }

        function showAlert(type, message) {
            formAlert.className = 'alert show ' + type;
            formAlertText.textContent = message;
            const icon = formAlert.querySelector('i');
            icon.className = type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-exclamation';
        }

        function hideAlert() {
            formAlert.className = 'alert';
        }

        function setLoading(isLoading) {
            loginButton.disabled = isLoading;
            loginButton.classList.toggle('loading', isLoading);
            loginButtonText.textContent = isLoading ? '登录中...' : '登录';
            account.disabled = isLoading;
            password.disabled = isLoading;
        }

        function openModal(title, text) {
            modalTitle.textContent = title;
            modalText.textContent = text;
            modalMask.classList.add('show');
            modalConfirm.focus();
        }

        function closeModal() {
            modalMask.classList.remove('show');
        }

        account.addEventListener('input', () => {
            clearFieldError(account, accountError);
            hideAlert();
        });

        password.addEventListener('input', () => {
            clearFieldError(password, passwordError);
            hideAlert();
        });

        passwordToggle.addEventListener('click', () => {
            const visible = password.type === 'text';
            password.type = visible ? 'password' : 'text';
            passwordToggle.setAttribute('aria-label', visible ? '显示密码' : '隐藏密码');
            passwordToggle.querySelector('i').className = visible ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
            password.focus();
        });

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            hideAlert();

            const accountValue = account.value.trim();
            const passwordValue = password.value.trim();
            let valid = true;

            if (!accountValue) {
                setFieldError(account, accountError, '请输入账号或邮箱');
                valid = false;
            }

            if (!passwordValue) {
                setFieldError(password, passwordError, '请输入密码');
                valid = false;
            }

            if (!valid) {
                showAlert('error', '请输入账号和密码后再登录。');
                (!accountValue ? account : password).focus();
                return;
            }

            setLoading(true);
            window.setTimeout(() => {
                setLoading(false);
                if (accountValue.toLowerCase() === 'disabled') {
                    showAlert('error', '该账号已停用，请联系管理员处理。');
                    account.focus();
                    return;
                }

                if (passwordValue !== 'admin123') {
                    showAlert('error', '账号或密码错误，请检查后重试。');
                    password.focus();
                    return;
                }

                showAlert('success', '登录成功，即将进入工作台。');
            }, 720);
        });

        forgotButton.addEventListener('click', () => {
            openModal('忘记密码', '请联系系统管理员重置密码。为保护邮箱与工单数据安全，第一版不开放自助找回入口。');
        });

        noAccountButton.addEventListener('click', () => {
            openModal('首次无账号', '后台账号由管理员统一创建。请联系管理员开通账号并分配角色后再登录。');
        });

        modalCancel.addEventListener('click', closeModal);
        modalConfirm.addEventListener('click', closeModal);
        modalMask.addEventListener('click', (event) => {
            if (event.target === modalMask) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && modalMask.classList.contains('show')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
