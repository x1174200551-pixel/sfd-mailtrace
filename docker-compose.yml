services:
  mysql:
    image: mysql:8.0
    container_name: mailtrace-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mailtrace
      MYSQL_USER: mailtrace
      MYSQL_PASSWORD: mailtrace
      TZ: Asia/Shanghai
    volumes:
      - mailtrace_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: mailtrace-backend
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ""
      APPLICATION_NAME: ntn-cmp-mailtrace-api
      NACOS_CONFIG_ENABLED: "true"
      NACOS_SERVER_ADDR: host.docker.internal:8848
      NACOS_NAMESPACE: ntn
      NACOS_GROUP: bcs
      NACOS_FILE_EXTENSION: yaml
      # 正式环境如果 Nacos 开启认证，需要额外配置：
      # NACOS_USERNAME: <nacos-username>
      # NACOS_PASSWORD: <nacos-password>
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    container_name: mailtrace-web
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"

  minio:
    image: minio/minio:latest
    container_name: mailtrace-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mailtrace_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mailtrace_mysql_data:
  mailtrace_minio_data:
